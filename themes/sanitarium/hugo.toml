baseURL = 'https://example.org/'
languageCode = 'en-US'
title = 'My New Hugo Site'

[outputFormats.PostData]
  mediaType = "text/csv"
  isPlainText = true
  notAlternative = true

[outputFormats.Banner]
  mediaType = "text/html"
  baseName = "banner"
  isPlainText = true
  permalinkable = true

# Taxonomies
[taxonomies]
  tag = "tags"
  author = "authors"
  series = "series"

[menus]
  [[menus.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10

  [[menus.main]]
    name = 'Posts'
    pageRef = '/posts'
    weight = 20

  [[menus.main]]
    name = 'Tags'
    pageRef = '/tags'
    weight = 30

[module]
  [module.hugoVersion]
    extended = true
    min = '0.146.0'

[markup.goldmark.renderer]
unsafe = true  # Allow HTML in markdown
